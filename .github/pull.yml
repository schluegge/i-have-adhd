# Pull app (https://github.com/apps/pull) keeps this fork in sync with the original repo.
# "merge" keeps our own changes. If the original changed the same lines, Pull leaves the pull request
# open with the merge-conflict label instead of touching main, so nothing breaks.
version: "1"
rules:
  - base: main
    upstream: ayghri:main
    mergeMethod: merge
    mergeUnstable: false
    conflictReviewers:
      - schluegge
    conflictLabel: "merge-conflict"
